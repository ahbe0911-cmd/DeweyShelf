name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'apk/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare installable package
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/ChidemanYar-Dewey-v2.0.0.apk
          sha256sum apk/ChidemanYar-Dewey-v2.0.0.apk > apk/ChidemanYar-Dewey-v2.0.0.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChidemanYar-Dewey-v2.0.0
          path: |
            apk/ChidemanYar-Dewey-v2.0.0.apk
            apk/ChidemanYar-Dewey-v2.0.0.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: ChidemanYar-Dewey-v2.0.0
          path: apk

      - name: Publish APK to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/ChidemanYar-Dewey-v2.0.0.apk apk/ChidemanYar-Dewey-v2.0.0.sha256
          if git diff --cached --quiet; then
            echo 'APK is already current.'
          else
            git commit -m 'افزودن APK نسخه 2.0.0 [skip ci]'
            git push
          fi
