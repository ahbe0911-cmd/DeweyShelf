name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'apk/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/ChidemanYar-Dewey-v1.0.0.apk
          sha256sum apk/ChidemanYar-Dewey-v1.0.0.apk > apk/ChidemanYar-Dewey-v1.0.0.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChidemanYar-Dewey-v1.0.0
          path: apk/ChidemanYar-Dewey-v1.0.0.apk
          if-no-files-found: error

      - name: Publish APK to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/ChidemanYar-Dewey-v1.0.0.apk apk/ChidemanYar-Dewey-v1.0.0.sha256
          if git diff --cached --quiet; then
            echo 'APK is already current.'
          else
            git commit -m 'افزودن APK نسخه 1.0.0 [skip ci]'
            git push
          fi