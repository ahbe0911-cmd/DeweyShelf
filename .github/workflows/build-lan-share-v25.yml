name: Build LAN SHARE V2.5 QR + Custom PIN

on:
  push:
    branches:
      - build/lan-share-v24-fonts
    paths:
      - 'lan-build/v25-patch/**'
      - 'lan-build/v25-assets/**'
      - '.github/workflows/build-lan-share-v25.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows V2.5 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Reconstruct source and apply V2.3 + V2.5 patches
        shell: pwsh
        run: |
          $parts = @(
            'lan-build/minsrc_v4/part00.b64',
            'lan-build/minsrc_v4/part01.b64',
            'lan-build/minsrc_v4/part02.b64',
            'lan-build/minsrc_v4/part03.b64'
          )
          $b64 = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ''
          [IO.File]::WriteAllBytes('lan-min.tar.gz', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'lan-min.tar.gz' -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '377f0c46f6c1ba7a18fbf41ac0b08d565f3b84d337e3fdea31b33fba0a1c17af') { throw "Source SHA256 mismatch: $hash" }
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null
          tar -xzf lan-min.tar.gz -C buildsrc
          Copy-Item -Path 'lan-build\v2-overlay\*' -Destination 'buildsrc\lan_file_transfer_v1' -Recurse -Force
          Copy-Item -Path 'lan-build\v22-overlay\*' -Destination 'buildsrc\lan_file_transfer_v1' -Recurse -Force
          python lan-build/v23-patch/patch_android.py
          $patchB64 = Get-Content 'lan-build/v25-patch/patch_v25.py.gz.b64' -Raw
          [IO.File]::WriteAllBytes('patch_v25.py.gz', [Convert]::FromBase64String($patchB64))
          python -c "import gzip,pathlib; pathlib.Path('patch_v25.py').write_bytes(gzip.decompress(pathlib.Path('patch_v25.py.gz').read_bytes()))"
          python patch_v25.py
          python -m py_compile patch_v25.py
          if (!(Test-Path 'buildsrc\lan_file_transfer_v1\android\app\src\main\java\ir\local\lantransfer\QrScannerActivity.java')) { throw 'QR scanner patch missing' }
          if ((Get-Content 'buildsrc\lan_file_transfer_v1\pc\lantransfer\gui.py' -Raw) -notmatch '_refresh_qr') { throw 'Windows dynamic QR patch missing' }
          if ((Get-Content 'buildsrc\lan_file_transfer_v1\pc\app.py' -Raw) -notmatch 'set_pin') { throw 'Custom PIN patch missing' }

      - name: Reconstruct embedded fonts
        shell: pwsh
        run: |
          $fontParts = @(
            'lan-build/v25-assets/font00.b64',
            'lan-build/v25-assets/font01_02.b64',
            'lan-build/v25-assets/font03.b64',
            'lan-build/v25-assets/font04.b64',
            'lan-build/v25-assets/font05.b64',
            'lan-build/v25-assets/font06.b64',
            'lan-build/v25-assets/font07.b64'
          )
          $fb64 = ($fontParts | ForEach-Object { Get-Content $_ -Raw }) -join ''
          [IO.File]::WriteAllBytes('fonts.zip', [Convert]::FromBase64String($fb64))
          $fh = (Get-FileHash 'fonts.zip' -Algorithm SHA256).Hash.ToLower()
          if ($fh -ne '363592061ddab7cfe0c02af995495a44d3a95579a455eedfbf99021f570c9f16') { throw "Font SHA256 mismatch: $fh" }
          Expand-Archive -Path fonts.zip -DestinationPath fonttmp -Force
          New-Item -ItemType Directory -Force -Path 'buildsrc\lan_file_transfer_v1\pc\assets\fonts' | Out-Null
          Copy-Item 'fonttmp\Far_Nazanin.ttf' 'buildsrc\lan_file_transfer_v1\pc\assets\fonts\Far_Nazanin.ttf' -Force
          Copy-Item 'fonttmp\Far_TitrBd.ttf' 'buildsrc\lan_file_transfer_v1\pc\assets\fonts\Far_TitrBd.ttf' -Force

      - name: Install Windows dependencies
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r dev-requirements.txt pyinstaller pillow qrcode

      - name: Validate PC source and tests
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m pytest -q tests

      - name: Generate Windows app icon
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          @'
          from PIL import Image, ImageDraw
          S=256
          img=Image.new('RGBA',(S,S),(25,118,232,255)); d=ImageDraw.Draw(img)
          d.ellipse((38,38,218,218), outline='white', width=11)
          d.polygon([(65,126),(199,73),(145,190),(124,142)], fill='white')
          d.polygon([(124,142),(110,178),(97,148)], fill=(220,239,255,255))
          img.save('assets/lan_share.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
          if (!(Test-Path 'assets\lan_share.ico')) { throw 'ICO generation failed' }

      - name: Add PyInstaller windowed stdio runtime hook
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          @'
          import os, sys
          if sys.stdout is None: sys.stdout = open(os.devnull, "w", encoding="utf-8")
          if sys.stderr is None: sys.stderr = open(os.devnull, "w", encoding="utf-8")
          '@ | Set-Content -Encoding UTF8 pyi_rth_windowed_stdio.py

      - name: Build standalone Windows EXE
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --runtime-hook pyi_rth_windowed_stdio.py --icon assets\lan_share.ico --add-data "assets\lan_share.ico;assets" --add-data "assets\fonts;assets\fonts" --name LANShareV25 app.py --collect-all uvicorn --collect-all fastapi --collect-all starlette --collect-all websockets --collect-all qrcode --collect-all PIL
          if (!(Test-Path 'dist\LANShareV25.exe')) { throw 'PyInstaller output missing' }

      - name: Real HTTP + UDP Radar smoke test
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\LANShareV25.exe' -PassThru
          try {
            $ok = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) { throw "App exited with code $($p.ExitCode)" }
              try {
                $r = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/ping' -TimeoutSec 1
                if ($r.service -eq 'LAN File Transfer') { $ok=$true; break }
              } catch {}
            }
            if (!$ok) { throw 'HTTP /api/ping did not become available' }
            $udp = New-Object System.Net.Sockets.UdpClient
            $udp.Client.ReceiveTimeout = 2500
            $msg = [Text.Encoding]::UTF8.GetBytes('LANFT_DISCOVER_V2')
            [void]$udp.Send($msg,$msg.Length,'127.0.0.1',8766)
            $remote = New-Object System.Net.IPEndPoint([Net.IPAddress]::Any,0)
            $bytes = $udp.Receive([ref]$remote)
            $obj = ([Text.Encoding]::UTF8.GetString($bytes)) | ConvertFrom-Json
            $udp.Close()
            if ($obj.service -ne 'LAN File Transfer' -or $obj.port -ne 8765) { throw 'UDP radar response invalid' }
            Write-Host 'LAN SHARE V2.5 executable + HTTP + UDP Radar smoke test passed.'
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Build Windows Setup with firewall rules
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          @'
          [Setup]
          AppId={{A783A5C0-2B74-4B25-98A8-8A25512E91F5}
          AppName=LAN SHARE
          AppVersion=2.5.0
          AppPublisher=LAN SHARE
          DefaultDirName={autopf}\LAN File Transfer
          DefaultGroupName=LAN SHARE
          DisableProgramGroupPage=yes
          OutputDir=installer-output
          OutputBaseFilename=LANShare-Windows-V2.5-Setup
          SetupIconFile=assets\lan_share.ico
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\LANShareV25.exe

          [Files]
          Source: "dist\LANShareV25.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{autoprograms}\LAN SHARE"; Filename: "{app}\LANShareV25.exe"
          Name: "{autodesktop}\LAN SHARE"; Filename: "{app}\LANShareV25.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"

          [Run]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LAN File Transfer V2 TCP"""; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LAN File Transfer V2 TCP"" dir=in action=allow program=""{app}\LANShareV25.exe"" enable=yes profile=private,public protocol=TCP localport=8765 remoteip=localsubnet"; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LAN File Transfer V2 UDP Radar"""; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LAN File Transfer V2 UDP Radar"" dir=in action=allow program=""{app}\LANShareV25.exe"" enable=yes profile=private,public protocol=UDP localport=8766 remoteip=localsubnet"; Flags: runhidden
          Filename: "{app}\LANShareV25.exe"; Description: "Launch LAN SHARE"; Flags: nowait postinstall skipifsilent

          [UninstallRun]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LAN File Transfer V2 TCP"""; Flags: runhidden; RunOnceId: "FirewallTcp"
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LAN File Transfer V2 UDP Radar"""; Flags: runhidden; RunOnceId: "FirewallUdp"
          '@ | Set-Content -Encoding UTF8 installer.iss
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc installer.iss
          if (!(Test-Path 'installer-output\LANShare-Windows-V2.5-Setup.exe')) { throw 'Installer output missing' }

      - name: Upload Windows V2.5 installer
        uses: actions/upload-artifact@v4
        with:
          name: LANShare-Windows-V2.5
          path: buildsrc/lan_file_transfer_v1/pc/installer-output/LANShare-Windows-V2.5-Setup.exe
          if-no-files-found: error

  android:
    name: Android V2.5 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source and apply V2.3 + V2.5 patches
        shell: bash
        run: |
          cat lan-build/minsrc_v4/part00.b64 lan-build/minsrc_v4/part01.b64 lan-build/minsrc_v4/part02.b64 lan-build/minsrc_v4/part03.b64 | base64 -d > lan-min.tar.gz
          echo '377f0c46f6c1ba7a18fbf41ac0b08d565f3b84d337e3fdea31b33fba0a1c17af  lan-min.tar.gz' | sha256sum -c -
          mkdir -p buildsrc
          tar -xzf lan-min.tar.gz -C buildsrc
          cp -a lan-build/v2-overlay/. buildsrc/lan_file_transfer_v1/
          cp -a lan-build/v22-overlay/. buildsrc/lan_file_transfer_v1/
          python lan-build/v23-patch/patch_android.py
          base64 -d lan-build/v25-patch/patch_v25.py.gz.b64 > patch_v25.py.gz
          python - <<'PY'
          import gzip, pathlib
          pathlib.Path('patch_v25.py').write_bytes(gzip.decompress(pathlib.Path('patch_v25.py.gz').read_bytes()))
          PY
          python patch_v25.py
          grep -q 'versionName = "2.5.0"' buildsrc/lan_file_transfer_v1/android/app/build.gradle.kts
          grep -q 'QrScannerActivity' buildsrc/lan_file_transfer_v1/android/app/src/main/AndroidManifest.xml
          grep -q 'heroAction' buildsrc/lan_file_transfer_v1/android/app/src/main/java/ir/local/lantransfer/MainActivity.java
          sed -i 's/compileSdk = 37/compileSdk = 36/' buildsrc/lan_file_transfer_v1/android/app/build.gradle.kts

      - name: Reconstruct embedded Android fonts
        shell: bash
        run: |
          cat lan-build/v25-assets/font00.b64 lan-build/v25-assets/font01_02.b64 lan-build/v25-assets/font03.b64 lan-build/v25-assets/font04.b64 lan-build/v25-assets/font05.b64 lan-build/v25-assets/font06.b64 lan-build/v25-assets/font07.b64 | base64 -d > fonts.zip
          echo '363592061ddab7cfe0c02af995495a44d3a95579a455eedfbf99021f570c9f16  fonts.zip' | sha256sum -c -
          mkdir -p fonttmp buildsrc/lan_file_transfer_v1/android/app/src/main/res/font
          unzip -q fonts.zip -d fonttmp
          cp fonttmp/Far_Nazanin.ttf buildsrc/lan_file_transfer_v1/android/app/src/main/res/font/far_nazanin.ttf
          cp fonttmp/Far_TitrBd.ttf buildsrc/lan_file_transfer_v1/android/app/src/main/res/font/far_titr_bold.ttf

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Compile Android V2.5 APK
        working-directory: buildsrc/lan_file_transfer_v1/android
        run: |
          gradle --no-daemon :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p "$GITHUB_WORKSPACE/androidout"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/androidout/LANShare-Android-V2.5.apk"

      - name: Upload Android V2.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: LANShare-Android-V2.5
          path: androidout/LANShare-Android-V2.5.apk
          if-no-files-found: error

  publish:
    name: Publish V2.5 installers
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/lan-share-v24-fonts

      - uses: actions/download-artifact@v4
        with:
          name: LANShare-Windows-V2.5
          path: release-v25

      - uses: actions/download-artifact@v4
        with:
          name: LANShare-Android-V2.5
          path: release-v25

      - name: Publish files and checksums
        shell: bash
        run: |
          cd release-v25
          sha256sum LANShare-Windows-V2.5-Setup.exe LANShare-Android-V2.5.apk > SHA256SUMS-V2.5.txt
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-v25/LANShare-Windows-V2.5-Setup.exe release-v25/LANShare-Android-V2.5.apk release-v25/SHA256SUMS-V2.5.txt
          git commit -m 'build: publish LAN SHARE V2.5 QR + PIN installers [skip build]' || exit 0
          git push origin HEAD:build/lan-share-v24-fonts
