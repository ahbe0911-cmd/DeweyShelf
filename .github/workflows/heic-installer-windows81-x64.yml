name: HEIC Pro Converter - Windows 8.1 x64 Installer

on:
  push:
    branches:
      - 'agent/heic-pro-converter-build'
    paths:
      - 'heic-pro-converter/**'
      - '.github/workflows/heic-installer-windows81-x64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer-win81:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: heic-pro-converter

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.8 x64 compatibility runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: heic-pro-converter/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade "pip==24.3.1"
          python -m pip install -r requirements.txt

      - name: Validate x64 and source
        shell: pwsh
        run: |
          python -c "import struct,sys; assert struct.calcsize('P')*8 == 64; print(sys.version); print('Python architecture: 64-bit')"
          python -m py_compile src/app.py src/converter.py

      - name: Build Windows x64 application EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "HEIC-Pro-Converter-v6-Silver-Studio" --collect-all pillow_heif --collect-all customtkinter --hidden-import pillow_heif --hidden-import tkinter src/app.py

      - name: Smoke test application EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/HEIC-Pro-Converter-v6-Silver-Studio.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Portable EXE exited during startup. Exit code: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'Portable EXE startup test passed.'

      - name: Download Microsoft VC++ 2015-2019 x64 runtime for Windows 8.1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          $url = 'https://aka.ms/vs/16/release/14.29.30153/VC_Redist.x64.exe'
          $dest = (Join-Path (Get-Location) 'vendor\VC_redist.x64.exe')
          curl.exe -L --fail --retry 3 --output $dest $url
          if (-not (Test-Path $dest)) { throw 'VC++ Redistributable download failed.' }
          $sig = Get-AuthenticodeSignature $dest
          Write-Host "VC Redist signature status: $($sig.Status)"
          Write-Host "VC Redist signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw 'VC++ Redistributable signature is not valid.' }
          if ($sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'VC++ Redistributable is not signed by Microsoft.' }
          Get-Item $dest | Format-List FullName,Length
          Get-FileHash $dest -Algorithm SHA256

      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found.' }
          Write-Host "Inno Setup compiler found: $iscc"

      - name: Build Windows 8.1 x64 installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_installer_win81 | Out-Null
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc 'installer\windows81_x64.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed with exit code $LASTEXITCODE" }
          $setup = 'dist_installer_win81\HEIC-Pro-Converter-v6-Silver-Studio-Setup-Windows81-x64.exe'
          if (-not (Test-Path $setup)) { throw 'Windows 8.1 installer was not created.' }
          Get-Item $setup | Format-List FullName,Length
          Get-FileHash $setup -Algorithm SHA256

      - name: Silent install package validation
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'dist_installer_win81\HEIC-Pro-Converter-v6-Silver-Studio-Setup-Windows81-x64.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'HEICProConverterWin81Compat'
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR=' + $installDir))
          $p = Start-Process -FilePath $setup -ArgumentList $args -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer exited with code $($p.ExitCode)" }
          $installedExe = Join-Path $installDir 'HEIC-Pro-Converter-v6-Silver-Studio.exe'
          if (-not (Test-Path $installedExe)) { throw 'Installed EXE not found.' }
          Write-Host "Installer package validation passed: $installDir"

      - name: Installed application smoke test
        shell: pwsh
        run: |
          $installedExe = Join-Path (Join-Path $env:RUNNER_TEMP 'HEICProConverterWin81Compat') 'HEIC-Pro-Converter-v6-Silver-Studio.exe'
          $p = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Installed application exited during startup. Exit code: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'Installed application startup test passed.'

      - name: Silent uninstall validation
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'HEICProConverterWin81Compat'
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller not found.' }
          $p = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Uninstaller exited with code $($p.ExitCode)" }
          Write-Host 'Uninstall validation passed.'

      - name: Upload Windows 8.1 x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: HEIC-Pro-Converter-v6-Silver-Studio-Setup-Windows81-x64
          path: heic-pro-converter/dist_installer_win81/HEIC-Pro-Converter-v6-Silver-Studio-Setup-Windows81-x64.exe
          if-no-files-found: error
          retention-days: 30
