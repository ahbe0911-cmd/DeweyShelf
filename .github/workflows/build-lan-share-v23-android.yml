name: Build LAN SHARE Android V2.3 Responsive

on:
  push:
    branches:
      - build/lan-file-transfer-v1
    paths:
      - 'lan-build/v23-patch/**'
      - '.github/workflows/build-lan-share-v23-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android V2.3 responsive APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct base and apply V2/V2.2/V2.3 layers
        shell: bash
        run: |
          cat lan-build/minsrc_v4/part00.b64 lan-build/minsrc_v4/part01.b64 lan-build/minsrc_v4/part02.b64 lan-build/minsrc_v4/part03.b64 | base64 -d > lan-min.tar.gz
          echo '377f0c46f6c1ba7a18fbf41ac0b08d565f3b84d337e3fdea31b33fba0a1c17af  lan-min.tar.gz' | sha256sum -c -
          mkdir -p buildsrc
          tar -xzf lan-min.tar.gz -C buildsrc
          cp -a lan-build/v2-overlay/. buildsrc/lan_file_transfer_v1/
          cp -a lan-build/v22-overlay/. buildsrc/lan_file_transfer_v1/
          python lan-build/v23-patch/patch_android.py
          sed -i 's/compileSdk = 37/compileSdk = 36/' buildsrc/lan_file_transfer_v1/android/app/build.gradle.kts
          grep -q 'versionName = "2.3.0"' buildsrc/lan_file_transfer_v1/android/app/build.gradle.kts
          grep -q 'isCompactWidth' buildsrc/lan_file_transfer_v1/android/app/src/main/java/ir/local/lantransfer/MainActivity.java

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Compile Android V2.3 APK
        working-directory: buildsrc/lan_file_transfer_v1/android
        run: |
          gradle --no-daemon :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p "$GITHUB_WORKSPACE/androidout"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/androidout/LANShare-Android-V2.3.apk"

      - name: Upload Android V2.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: LANShare-Android-V2.3
          path: androidout/LANShare-Android-V2.3.apk
          if-no-files-found: error

      - name: Publish Android V2.3
        shell: bash
        run: |
          mkdir -p release-v23
          cp androidout/LANShare-Android-V2.3.apk release-v23/
          sha256sum release-v23/LANShare-Android-V2.3.apk > release-v23/SHA256SUMS-V2.3.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-v23/LANShare-Android-V2.3.apk release-v23/SHA256SUMS-V2.3.txt
          git commit -m 'build: publish responsive Android V2.3 [skip build]' || exit 0
          git push origin HEAD:build/lan-file-transfer-v1
