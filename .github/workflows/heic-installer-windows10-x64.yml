name: HEIC Pro Converter - Windows 10 x64 Installer

on:
  push:
    branches:
      - 'agent/heic-pro-converter-build'
    paths:
      - 'heic-pro-converter/**'
      - '.github/workflows/heic-installer-windows10-x64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: heic-pro-converter

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.8 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: heic-pro-converter/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade "pip==24.3.1"
          python -m pip install -r requirements.txt

      - name: Validate Windows x64 build environment
        shell: pwsh
        run: |
          python -c "import struct,sys; assert struct.calcsize('P')*8 == 64; print(sys.version); print('Python architecture: 64-bit')"
          python -m py_compile src/app.py src/converter.py

      - name: Build application EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "HEIC-Pro-Converter-v6-Silver-Studio" --collect-all pillow_heif --collect-all customtkinter --hidden-import pillow_heif --hidden-import tkinter src/app.py

      - name: Smoke test portable EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/HEIC-Pro-Converter-v6-Silver-Studio.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Portable EXE exited during startup. Exit code: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'Portable EXE startup test passed.'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found.' }
          & $iscc /?

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_installer | Out-Null
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc 'installer\windows10_x64.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed with exit code $LASTEXITCODE" }
          $setup = 'dist_installer\HEIC-Pro-Converter-v6-Silver-Studio-Setup.exe'
          if (-not (Test-Path $setup)) { throw 'Installer was not created.' }
          Get-Item $setup | Format-List FullName,Length
          Get-FileHash $setup -Algorithm SHA256

      - name: Silent install test
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'dist_installer\HEIC-Pro-Converter-v6-Silver-Studio-Setup.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'HEICProConverterV6'
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR=' + $installDir))
          $p = Start-Process -FilePath $setup -ArgumentList $args -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer exited with code $($p.ExitCode)" }
          $installedExe = Join-Path $installDir 'HEIC-Pro-Converter-v6-Silver-Studio.exe'
          if (-not (Test-Path $installedExe)) { throw 'Installed EXE not found.' }
          Write-Host "Installed successfully to $installDir"

      - name: Installed application smoke test
        shell: pwsh
        run: |
          $installedExe = Join-Path (Join-Path $env:RUNNER_TEMP 'HEICProConverterV6') 'HEIC-Pro-Converter-v6-Silver-Studio.exe'
          $p = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Installed application exited during startup. Exit code: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'Installed application startup test passed.'

      - name: Silent uninstall test
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'HEICProConverterV6'
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller not found.' }
          $p = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Uninstaller exited with code $($p.ExitCode)" }
          Write-Host 'Uninstall test passed.'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: HEIC-Pro-Converter-v6-Silver-Studio-Setup-Windows10-x64
          path: heic-pro-converter/dist_installer/HEIC-Pro-Converter-v6-Silver-Studio-Setup.exe
          if-no-files-found: error
          retention-days: 30
