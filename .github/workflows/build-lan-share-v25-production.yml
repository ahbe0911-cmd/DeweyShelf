name: Build LAN SHARE V2.5 Production

on:
  push:
    branches: [build/lan-share-v24-fonts]
    paths:
      - 'lan-build/v25-clean/**'
      - 'lan-build/v25-qr-pin/**'
      - 'lan-build/v25-clean-fonts/**'
      - '.github/workflows/build-lan-share-v25-production.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SRC: buildsrc/lan_file_transfer_v1
  FONT_SHA: 7bdbdb057ef0ededd57604a220fa0cc455b25a049922069482979977e2ac1318

jobs:
  windows:
    name: Windows Production Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Reconstruct V2.3 stable source and apply V2.5 features
        shell: pwsh
        run: |
          $parts=@('lan-build/minsrc_v4/part00.b64','lan-build/minsrc_v4/part01.b64','lan-build/minsrc_v4/part02.b64','lan-build/minsrc_v4/part03.b64')
          $b64=($parts|ForEach-Object{Get-Content $_ -Raw}) -join ''
          [IO.File]::WriteAllBytes('base.tar.gz',[Convert]::FromBase64String($b64))
          if((Get-FileHash base.tar.gz -Algorithm SHA256).Hash.ToLower() -ne '377f0c46f6c1ba7a18fbf41ac0b08d565f3b84d337e3fdea31b33fba0a1c17af'){throw 'Base source checksum failed'}
          New-Item -ItemType Directory -Force buildsrc|Out-Null
          tar -xzf base.tar.gz -C buildsrc
          Copy-Item 'lan-build\v2-overlay\*' $env:SRC -Recurse -Force
          Copy-Item 'lan-build\v22-overlay\*' $env:SRC -Recurse -Force
          python lan-build/v23-patch/patch_android.py
          python lan-build/v25-clean/patch_style_fonts.py
          python lan-build/v25-clean/patch_qr_compat.py
          python lan-build/v25-qr-pin/patch_qr_pin.py $env:SRC
          python lan-build/v25-clean/patch_android_compile_fix.py
          python -m py_compile lan-build/v25-clean/patch_style_fonts.py lan-build/v25-clean/patch_qr_compat.py lan-build/v25-qr-pin/patch_qr_pin.py lan-build/v25-clean/patch_android_compile_fix.py
          $g=Get-Content "$env:SRC\pc\lantransfer\gui.py" -Raw
          $a=Get-Content "$env:SRC\pc\app.py" -Raw
          if($g -notmatch '_show_qr_dialog' -or $g -notmatch '_apply_custom_pin'){throw 'QR/PIN desktop UI missing'}
          if($a -notmatch 'update_pin'){throw 'Custom PIN backend missing'}

      - name: Verify and embed exact user fonts
        shell: pwsh
        run: |
          $parts=0..5|ForEach-Object{"lan-build/v25-clean-fonts/part$($_.ToString('00')).b64"}
          $b64=($parts|ForEach-Object{Get-Content $_ -Raw}) -join ''
          [IO.File]::WriteAllBytes('fonts.zip',[Convert]::FromBase64String($b64))
          $hash=(Get-FileHash fonts.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "FONT SHA256=$hash"
          if($hash -ne $env:FONT_SHA){throw 'Font checksum failed'}
          Expand-Archive fonts.zip fonttmp -Force
          $naz=(Get-ChildItem fonttmp -Recurse -Filter Far_Nazanin.ttf|Select-Object -First 1).FullName
          $tit=(Get-ChildItem fonttmp -Recurse -Filter Far_TitrBd.ttf|Select-Object -First 1).FullName
          if(!$naz -or !$tit){throw 'Font TTF missing'}
          New-Item -ItemType Directory -Force "$env:SRC\pc\assets\fonts"|Out-Null
          Copy-Item $naz "$env:SRC\pc\assets\fonts\Far_Nazanin.ttf" -Force
          Copy-Item $tit "$env:SRC\pc\assets\fonts\Far_TitrBd.ttf" -Force

      - name: Install PC dependencies and tests
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r dev-requirements.txt pyinstaller pillow "qrcode[pil]"
          python -m compileall -q .
          python -m pytest -q tests

      - name: Source runtime smoke test
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          $p=Start-Process python -ArgumentList 'app.py' -PassThru
          try{
            $ok=$false
            for($i=0;$i -lt 40;$i++){
              Start-Sleep -Milliseconds 500
              if($p.HasExited){throw "Source app exited: $($p.ExitCode)"}
              try{$r=Invoke-RestMethod 'http://127.0.0.1:8765/api/ping' -TimeoutSec 1;if($r.service -eq 'LAN File Transfer'){$ok=$true;break}}catch{}
            }
            if(!$ok){throw 'Source HTTP server failed'}
            Write-Host 'SOURCE APP HTTP PASS'
          }finally{if(!$p.HasExited){Stop-Process -Id $p.Id -Force}}

      - name: Create app icon and runtime hook
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets|Out-Null
          @'
          from PIL import Image,ImageDraw
          im=Image.new('RGBA',(256,256),(27,121,238,255));d=ImageDraw.Draw(im)
          d.ellipse((34,34,222,222),outline='white',width=12)
          d.polygon([(61,126),(201,72),(147,191),(124,143),(94,166)],fill='white')
          im.save('assets/lan_share.ico',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@|python -
          @'
          import os,sys
          if sys.stdout is None: sys.stdout=open(os.devnull,'w',encoding='utf-8')
          if sys.stderr is None: sys.stderr=open(os.devnull,'w',encoding='utf-8')
          '@|Set-Content -Encoding UTF8 pyi_rth_windowed_stdio.py

      - name: Build fast-start onedir Windows app
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --runtime-hook pyi_rth_windowed_stdio.py --icon assets\lan_share.ico --add-data "assets\lan_share.ico;assets" --add-data "assets\fonts;assets\fonts" --name LANShareV25 app.py --collect-all uvicorn --collect-all fastapi --collect-all starlette --collect-all websockets --collect-all qrcode --collect-all PIL
          if(!(Test-Path dist\LANShareV25\LANShareV25.exe)){throw 'Frozen EXE missing'}

      - name: Frozen Windows HTTP and UDP Radar test
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          $p=Start-Process '.\dist\LANShareV25\LANShareV25.exe' -PassThru
          try{
            $ok=$false
            for($i=0;$i -lt 120;$i++){
              Start-Sleep -Milliseconds 500
              if($p.HasExited){throw "Frozen app exited: $($p.ExitCode)"}
              try{$r=Invoke-RestMethod 'http://127.0.0.1:8765/api/ping' -TimeoutSec 1;if($r.service -eq 'LAN File Transfer'){$ok=$true;break}}catch{}
            }
            if(!$ok){throw 'Frozen HTTP server failed'}
            $u=New-Object Net.Sockets.UdpClient;$u.Client.ReceiveTimeout=3000
            $m=[Text.Encoding]::UTF8.GetBytes('LANFT_DISCOVER_V2');[void]$u.Send($m,$m.Length,'127.0.0.1',8766)
            $ep=New-Object Net.IPEndPoint([Net.IPAddress]::Any,0);$b=$u.Receive([ref]$ep);$o=([Text.Encoding]::UTF8.GetString($b))|ConvertFrom-Json;$u.Close()
            if($o.service -ne 'LAN File Transfer' -or $o.port -ne 8765){throw 'UDP Radar response invalid'}
            Write-Host 'FROZEN APP HTTP + UDP RADAR PASS'
          }finally{if(!$p.HasExited){Stop-Process -Id $p.Id -Force}}

      - name: Build Windows Setup with LAN firewall rules
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          @'
          [Setup]
          AppId={{A783A5C0-2B74-4B25-98A8-8A25512E91F5}
          AppName=LAN SHARE
          AppVersion=2.5.0
          AppPublisher=LAN SHARE
          DefaultDirName={autopf}\LAN SHARE
          DefaultGroupName=LAN SHARE
          DisableProgramGroupPage=yes
          OutputDir=installer-output
          OutputBaseFilename=LANShare-Windows-V2.5-Setup
          SetupIconFile=assets\lan_share.ico
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\LANShareV25.exe
          [Files]
          Source: "dist\LANShareV25\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\LAN SHARE"; Filename: "{app}\LANShareV25.exe"
          Name: "{autodesktop}\LAN SHARE"; Filename: "{app}\LANShareV25.exe"
          [Run]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LAN SHARE TCP"""; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LAN SHARE TCP"" dir=in action=allow program=""{app}\LANShareV25.exe"" enable=yes profile=private,public protocol=TCP localport=8765 remoteip=localsubnet"; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LAN SHARE UDP Radar"""; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LAN SHARE UDP Radar"" dir=in action=allow program=""{app}\LANShareV25.exe"" enable=yes profile=private,public protocol=UDP localport=8766 remoteip=localsubnet"; Flags: runhidden
          [UninstallRun]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LAN SHARE TCP"""; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LAN SHARE UDP Radar"""; Flags: runhidden
          '@|Set-Content -Encoding UTF8 installer.iss
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
          if(!(Test-Path installer-output\LANShare-Windows-V2.5-Setup.exe)){throw 'Setup missing'}

      - uses: actions/upload-artifact@v4
        with:
          name: LANShare-Windows-V2.5-Production
          path: buildsrc/lan_file_transfer_v1/pc/installer-output/LANShare-Windows-V2.5-Setup.exe
          if-no-files-found: error

  android:
    name: Android Production APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source and apply V2.5 UI QR PIN
        shell: bash
        run: |
          cat lan-build/minsrc_v4/part00.b64 lan-build/minsrc_v4/part01.b64 lan-build/minsrc_v4/part02.b64 lan-build/minsrc_v4/part03.b64|base64 -d > base.tar.gz
          echo '377f0c46f6c1ba7a18fbf41ac0b08d565f3b84d337e3fdea31b33fba0a1c17af  base.tar.gz'|sha256sum -c -
          mkdir -p buildsrc && tar -xzf base.tar.gz -C buildsrc
          cp -a lan-build/v2-overlay/. "$SRC/"
          cp -a lan-build/v22-overlay/. "$SRC/"
          python lan-build/v23-patch/patch_android.py
          python lan-build/v25-clean/patch_style_fonts.py
          python lan-build/v25-clean/patch_qr_compat.py
          python lan-build/v25-qr-pin/patch_qr_pin.py "$SRC"
          python lan-build/v25-clean/patch_android_compile_fix.py
          grep -q 'scanConnectionQr' "$SRC/android/app/src/main/java/ir/local/lantransfer/MainActivity.java"
          grep -q 'android.permission.CAMERA' "$SRC/android/app/src/main/AndroidManifest.xml"
          grep -q 'zxing-android-embedded:4.3.0' "$SRC/android/app/build.gradle.kts"
          grep -q 'versionName = "2.5.0"' "$SRC/android/app/build.gradle.kts"
          sed -i 's/compileSdk = 37/compileSdk = 36/' "$SRC/android/app/build.gradle.kts"

      - name: Verify and embed exact user fonts
        shell: bash
        run: |
          cat lan-build/v25-clean-fonts/part00.b64 lan-build/v25-clean-fonts/part01.b64 lan-build/v25-clean-fonts/part02.b64 lan-build/v25-clean-fonts/part03.b64 lan-build/v25-clean-fonts/part04.b64 lan-build/v25-clean-fonts/part05.b64|base64 -d > fonts.zip
          echo "$FONT_SHA  fonts.zip"|sha256sum -c -
          mkdir -p fonttmp "$SRC/android/app/src/main/res/font"
          unzip -q fonts.zip -d fonttmp
          NAZ="$(find fonttmp -type f -name Far_Nazanin.ttf|head -1)"; TIT="$(find fonttmp -type f -name Far_TitrBd.ttf|head -1)"
          test -n "$NAZ" && test -n "$TIT"
          cp "$NAZ" "$SRC/android/app/src/main/res/font/far_nazanin.ttf"
          cp "$TIT" "$SRC/android/app/src/main/res/font/far_titr_bold.ttf"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Compile and package Android APK
        working-directory: buildsrc/lan_file_transfer_v1/android
        run: |
          gradle --no-daemon :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p "$GITHUB_WORKSPACE/androidout"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/androidout/LANShare-Android-V2.5.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LANShare-Android-V2.5-Production
          path: androidout/LANShare-Android-V2.5.apk
          if-no-files-found: error

  publish:
    name: Publish Verified V2.5
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/lan-share-v24-fonts
      - uses: actions/download-artifact@v4
        with:
          name: LANShare-Windows-V2.5-Production
          path: release-v25-production
      - uses: actions/download-artifact@v4
        with:
          name: LANShare-Android-V2.5-Production
          path: release-v25-production
      - name: Write checksums and publish
        shell: bash
        run: |
          cd release-v25-production
          sha256sum LANShare-Windows-V2.5-Setup.exe LANShare-Android-V2.5.apk > SHA256SUMS-V2.5.txt
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-v25-production/
          git commit -m 'build: publish verified LAN SHARE V2.5 installers [skip build]' || exit 0
          git push origin HEAD:build/lan-share-v24-fonts
