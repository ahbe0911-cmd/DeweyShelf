name: Build Khabar Cafe Public Web APK

on:
  push:
    branches: [khabar-cafe-public-web]
    paths:
      - .github/workflows/build-khabar-cafe-public-web.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct verified v0.3.1 base source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            khabar-cafe-min2/part-00a \
            khabar-cafe-min2/part-00c \
            khabar-cafe-min2/part-01 \
            khabar-cafe-min2/part-02 \
            khabar-cafe-min2/part-02-tail \
            khabar-cafe-min2/part-03 \
            khabar-cafe-min2/part-04 \
            | tr -d '[:space:]' > "$RUNNER_TEMP/app.b64"
          test "$(wc -c < "$RUNNER_TEMP/app.b64")" -eq 82492
          base64 -d "$RUNNER_TEMP/app.b64" > "$RUNNER_TEMP/app.zip"
          echo 'c4b9c6245affa909ea1acb06c5566194df7453143e41059da4696dd536136867  '$RUNNER_TEMP'/app.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/app.zip" -d "$RUNNER_TEMP/source"
          test -f "$RUNNER_TEMP/source/khabar_cafe/pubspec.yaml"

      - name: Apply no-login public Telegram mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source/khabar_cafe/docs" "$RUNNER_TEMP/source/khabar_cafe/test"
          python3 ci/khabar-public/patch_public_mode.py \
            "$RUNNER_TEMP/source/khabar_cafe" \
            "$GITHUB_WORKSPACE/ci/khabar-public"
          cp ci/khabar-public/public_gateway_test.dart \
            "$RUNNER_TEMP/source/khabar_cafe/test/public_gateway_test.dart"

      - name: Restore Vazirmatn assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source/khabar_cafe"
          mkdir -p assets/fonts licenses
          for weight in Regular Medium SemiBold Bold; do
            curl -fL --retry 3 \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-${weight}.ttf" \
              -o "assets/fonts/Vazirmatn-${weight}.ttf"
            test -s "assets/fonts/Vazirmatn-${weight}.ttf"
          done
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/OFL.txt" \
            -o licenses/Vazirmatn-OFL.txt
          test -s licenses/Vazirmatn-OFL.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Restore Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source/khabar_cafe/android"
          gradle wrapper --gradle-version 9.1.0
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Resolve packages
        working-directory: ${{ runner.temp }}/source/khabar_cafe
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ runner.temp }}/source/khabar_cafe
        run: flutter analyze

      - name: Test parser and core models
        working-directory: ${{ runner.temp }}/source/khabar_cafe
        run: flutter test test/public_gateway_test.dart

      - name: Build no-login ARM64 APK
        working-directory: ${{ runner.temp }}/source/khabar_cafe
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify TDLib is not bundled
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/source/khabar_cafe/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          if unzip -l "$APK" | grep -q 'libtdjson.so'; then
            echo 'Unexpected TDLib library found in public-web build.'
            exit 1
          fi
          cp "$APK" "$RUNNER_TEMP/KhabarCafe-v0.4.0-PublicWeb-arm64.apk"
          ls -lh "$RUNNER_TEMP/KhabarCafe-v0.4.0-PublicWeb-arm64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhabarCafe-v0.4.0-PublicWeb-arm64
          path: ${{ runner.temp }}/KhabarCafe-v0.4.0-PublicWeb-arm64.apk
          if-no-files-found: error
          retention-days: 14
