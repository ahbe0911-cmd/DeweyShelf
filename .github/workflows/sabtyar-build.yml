name: Build Sabtyar APK

on:
  push:
    branches:
      - chatgpt/sabtyar-apk-20260812
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct Sabtyar v2.2
        run: |
          cat .build/sabtyar.part00 .build/sabtyar.part01 .build/sabtyar.part02 .build/sabtyar.part03 .build/sabtyar.part04 .build/sabtyar.part05 > /tmp/sabtyar-source.zip
          rm -rf sabtyar
          mkdir -p sabtyar
          unzip -q /tmp/sabtyar-source.zip -d sabtyar
          test -f sabtyar/settings.gradle.kts

          cat .build/ui221_far.gz.b64 | base64 -d | gzip -d > sabtyar/app/src/main/java/com/sabtyar/app/ui/SabtyarApp.kt
          sed -i 's/A4/A۴/g' sabtyar/app/src/main/java/com/sabtyar/app/ui/SabtyarApp.kt
          cat .build/theme221_far.gz.b64 | base64 -d | gzip -d > sabtyar/app/src/main/java/com/sabtyar/app/ui/theme/Theme.kt
          cat .build/models200.gz.b64 | base64 -d | gzip -d > sabtyar/app/src/main/java/com/sabtyar/app/data/Models.kt
          cat .build/pdf221_far.gz.b64 | base64 -d | gzip -d > sabtyar/app/src/main/java/com/sabtyar/app/pdf/PdfExporter.kt

          mkdir -p sabtyar/app/src/main/res/font
          cat .build/farfont221.part00 .build/farfont221.part01 .build/farfont221.part02 .build/farfont221.part03 | base64 -d | xz -d > sabtyar/app/src/main/res/font/far_nazanin.ttf
          test "$(stat -c%s sabtyar/app/src/main/res/font/far_nazanin.ttf)" -eq 56732
          echo 'f9abfdc13d9e7f72b2cf4cf7efc8d2cd578ddd1ac0ac6d971e2d8a133566e176  sabtyar/app/src/main/res/font/far_nazanin.ttf' | sha256sum -c -

          sed -E -i 's#androidx.room:room-runtime:[0-9.]+#androidx.room:room-runtime:2.8.4#g; s#androidx.room:room-ktx:[0-9.]+#androidx.room:room-ktx:2.8.4#g; s#androidx.room:room-compiler:[0-9.]+#androidx.room:room-compiler:2.8.4#g' sabtyar/app/build.gradle.kts
          sed -E -i 's/versionCode = [0-9]+/versionCode = 220/' sabtyar/app/build.gradle.kts
          sed -E -i 's/versionName = "[0-9.]+"/versionName = "2.2.0"/' sabtyar/app/build.gradle.kts

          grep -n 'PaidCodesScreen\|toPersianDigits\|چاپ A۴ کدهای ملی' sabtyar/app/src/main/java/com/sabtyar/app/ui/SabtyarApp.kt
          grep -n 'far_nazanin\|FarNazaninFamily' sabtyar/app/src/main/java/com/sabtyar/app/ui/theme/Theme.kt
          grep -n 'toPersianDigits\|drawRect\|drawLine\|far_nazanin' sabtyar/app/src/main/java/com/sabtyar/app/pdf/PdfExporter.kt
          grep 'versionCode\|versionName\|androidx.room' sabtyar/app/build.gradle.kts

      - name: Unit tests
        working-directory: sabtyar
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build APK
        working-directory: sabtyar
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          cp sabtyar/app/build/outputs/apk/debug/app-debug.apk sabtyar-v2.2.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose sabtyar-v2.2.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging sabtyar-v2.2.0.apk | head -5
          unzip -t sabtyar-v2.2.0.apk >/dev/null
          sha256sum sabtyar-v2.2.0.apk | tee sabtyar-v2.2.0.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sabtyar-v2.2.0-apk
          path: |
            sabtyar-v2.2.0.apk
            sabtyar-v2.2.0.sha256
          if-no-files-found: error
