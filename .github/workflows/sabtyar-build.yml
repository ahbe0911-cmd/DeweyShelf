name: Build Sabtyar APK

on:
  push:
    branches:
      - chatgpt/sabtyar-apk-20260812
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct and redesign project
        run: |
          cat .build/sabtyar.part00 .build/sabtyar.part01 .build/sabtyar.part02 .build/sabtyar.part03 .build/sabtyar.part04 .build/sabtyar.part05 > /tmp/sabtyar-source.zip
          mkdir -p sabtyar
          unzip -q /tmp/sabtyar-source.zip -d sabtyar
          test -f sabtyar/settings.gradle.kts
          sed -E -i 's#androidx.room:room-runtime:[0-9.]+#androidx.room:room-runtime:2.8.4#g; s#androidx.room:room-ktx:[0-9.]+#androidx.room:room-ktx:2.8.4#g; s#androidx.room:room-compiler:[0-9.]+#androidx.room:room-compiler:2.8.4#g' sabtyar/app/build.gradle.kts
          sed -i 's/versionName = "1.0.0"/versionName = "1.1.0"/' sabtyar/app/build.gradle.kts
          cat > /tmp/ui.b64 <<'EOF'

EOF
          base64 -d /tmp/ui.b64 | gunzip > sabtyar/app/src/main/java/com/sabtyar/app/ui/SabtyarApp.kt
          cat > /tmp/theme.b64 <<'EOF'

EOF
          base64 -d /tmp/theme.b64 | gunzip > sabtyar/app/src/main/java/com/sabtyar/app/ui/theme/Theme.kt
          grep 'androidx.room' sabtyar/app/build.gradle.kts
          grep 'versionName' sabtyar/app/build.gradle.kts
          grep -q 'مدیریت سریع ثبت افراد' sabtyar/app/src/main/java/com/sabtyar/app/ui/SabtyarApp.kt

      - name: Unit tests
        working-directory: sabtyar
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build APK
        working-directory: sabtyar
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename and verify APK
        run: |
          cp sabtyar/app/build/outputs/apk/debug/app-debug.apk sabtyar-v1.1.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose sabtyar-v1.1.0.apk
          sha256sum sabtyar-v1.1.0.apk | tee sabtyar-v1.1.0.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sabtyar-v1.1.0-apk
          path: |
            sabtyar-v1.1.0.apk
            sabtyar-v1.1.0.sha256
          if-no-files-found: error
