name: Build Sabtyar APK

on:
  push:
    branches:
      - chatgpt/sabtyar-apk-20260812
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct Sabtyar v1.2
        run: |
          cat .build/sabtyar.part00 .build/sabtyar.part01 .build/sabtyar.part02 .build/sabtyar.part03 .build/sabtyar.part04 .build/sabtyar.part05 > /tmp/sabtyar-source.zip
          rm -rf sabtyar
          mkdir -p sabtyar
          unzip -q /tmp/sabtyar-source.zip -d sabtyar
          test -f sabtyar/settings.gradle.kts
          cat .build/ui120.part0 .build/ui120.part1 .build/ui120.part2 .build/ui120.part3 | base64 -d | gzip -d > sabtyar/app/src/main/java/com/sabtyar/app/ui/SabtyarApp.kt
          cat .build/theme120.gz.b64 | base64 -d | gzip -d > sabtyar/app/src/main/java/com/sabtyar/app/ui/theme/Theme.kt
          sed -E -i 's#androidx.room:room-runtime:[0-9.]+#androidx.room:room-runtime:2.8.4#g; s#androidx.room:room-ktx:[0-9.]+#androidx.room:room-ktx:2.8.4#g; s#androidx.room:room-compiler:[0-9.]+#androidx.room:room-compiler:2.8.4#g' sabtyar/app/build.gradle.kts
          sed -E -i 's/versionCode = [0-9]+/versionCode = 12/' sabtyar/app/build.gradle.kts
          sed -E -i 's/versionName = "[0-9.]+"/versionName = "1.2.0"/' sabtyar/app/build.gradle.kts
          grep 'versionCode\|versionName\|androidx.room' sabtyar/app/build.gradle.kts
          grep -n 'PaidNationalCodeTable\|birthYearRequester' sabtyar/app/src/main/java/com/sabtyar/app/ui/SabtyarApp.kt

      - name: Unit tests
        working-directory: sabtyar
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build APK
        working-directory: sabtyar
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename and verify APK
        run: |
          cp sabtyar/app/build/outputs/apk/debug/app-debug.apk sabtyar-v1.2.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose sabtyar-v1.2.0.apk
          sha256sum sabtyar-v1.2.0.apk | tee sabtyar-v1.2.0.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sabtyar-v1.2.0-apk
          path: |
            sabtyar-v1.2.0.apk
            sabtyar-v1.2.0.sha256
          if-no-files-found: error
