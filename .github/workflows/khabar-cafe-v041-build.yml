name: Diagnose Khabar Cafe v0.4.2 slices

on:
  push:
    branches:
      - khabar-cafe-build

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hash original p06 p07 slices
        shell: bash
        run: |
          set -euo pipefail
          git show 8003cab809247066ae4562429d6b0ed33dd13a27:khabar-cafe-v042-overlay/p06.b64 > "$RUNNER_TEMP/p06"
          git show 8003cab809247066ae4562429d6b0ed33dd13a27:khabar-cafe-v042-overlay/p07.b64 > "$RUNNER_TEMP/p07"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          for name in ('p06','p07'):
              s=Path(__import__('os').environ['RUNNER_TEMP'], name).read_text()
              print(name, 'len=', len(s), 'sha=', hashlib.sha256(s.encode()).hexdigest())
              for i in range(0, len(s), 500):
                  c=s[i:i+500]
                  print(f'{name}-{i//500:02d} {hashlib.sha256(c.encode()).hexdigest()}')
          PY
