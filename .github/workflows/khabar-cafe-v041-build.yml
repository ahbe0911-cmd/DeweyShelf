name: Khabar Cafe v0.4.4 connected APK

on:
  push:
    branches:
      - khabar-cafe-v044-build
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble verified v0.4.1 source
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/khabar-cafe-v041.tar.xz"
          decode() { base64 -d "$1" >> "$RUNNER_TEMP/khabar-cafe-v041.tar.xz"; }
          decode khabar-cafe-v041/p00.b64
          decode khabar-cafe-v041-repair/p01-0.b64
          decode khabar-cafe-v041-repair/p01-1.b64
          decode khabar-cafe-v041-repair/p01-2.b64
          decode khabar-cafe-v041-repair2/p01-3-0.b64
          for part in khabar-cafe-v041-repair3/p01-3-1-*.b64; do decode "$part"; done
          decode khabar-cafe-v041-repair2/p01-3-2.b64
          decode khabar-cafe-v041-repair2/p01-3-3.b64
          decode khabar-cafe-v041/p02.b64
          decode khabar-cafe-v041/p03.b64
          decode khabar-cafe-v041-repair/p04-0.b64
          decode khabar-cafe-v041-repair/p04-1.b64
          decode khabar-cafe-v041-repair/p04-2.b64
          decode khabar-cafe-v041-repair2/p04-3-0.b64
          decode khabar-cafe-v041-repair2/p04-3-1.b64
          for part in khabar-cafe-v041-repair3/p04-3-2-*.b64; do decode "$part"; done
          decode khabar-cafe-v041-repair2/p04-3-3.b64
          decode khabar-cafe-v041/p05.b64
          decode khabar-cafe-v041/p06.b64
          decode khabar-cafe-v041/p07.b64
          xz -t "$RUNNER_TEMP/khabar-cafe-v041.tar.xz"
          mkdir -p kc
          tar -xJf "$RUNNER_TEMP/khabar-cafe-v041.tar.xz" -C kc
          test -f kc/khabar_cafe/pubspec.yaml

      - name: Reconstruct and repair v0.4.2 overlay
        shell: bash
        run: |
          set -euo pipefail
          for part in 00 01 02 03 04 05 06 07 08 09; do
            git show 8003cab809247066ae4562429d6b0ed33dd13a27:khabar-cafe-v042-overlay/p${part}.b64 > "$RUNNER_TEMP/p${part}.b64"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          root = Path(os.environ['RUNNER_TEMP'])
          p06 = (root / 'p06.b64').read_text()
          p07 = (root / 'p07.b64').read_text()
          fix06 = ""
          fix07 = ""
          assert len(p06) == 4000 and len(p07) == 4000
          assert len(fix06) == 500 and len(fix07) == 500
          p06 = p06[:1000] + fix06 + p06[1500:]
          p07 = p07[:3500] + fix07 + p07[4000:]
          (root / 'p06.b64').write_text(p06)
          (root / 'p07.b64').write_text(p07)
          assert hashlib.sha256(p06.encode()).hexdigest() == '47af838d3bc200a585665244564840d0b7b57bbe46af55409ba950ef6afd967d'
          assert hashlib.sha256(p07.encode()).hexdigest() == '7086e93cb646fc1fa5f6c00c0bdf81ffb79a779d1711bde824f8d45a6c3076ce'
          PY
          cat "$RUNNER_TEMP"/p{00,01,02,03,04,05,06,07,08,09}.b64 | base64 -d > "$RUNNER_TEMP/khabar-cafe-v042-overlay.tar.gz"
          echo 'e531f5c679c0013f4b4d8101a69d71a959a75fd2cb9501609ab3ec4f43826c49  '"$RUNNER_TEMP/khabar-cafe-v042-overlay.tar.gz" | sha256sum --check
          gzip -t "$RUNNER_TEMP/khabar-cafe-v042-overlay.tar.gz"
          tar -xzf "$RUNNER_TEMP/khabar-cafe-v042-overlay.tar.gz" -C kc/khabar_cafe
          grep -q 'version: 0.4.2+6' kc/khabar_cafe/pubspec.yaml

      - name: Apply v0.4.3 persistent-channel overlay
        shell: bash
        run: |
          set -euo pipefail
          cat khabar-cafe-v043-overlay/p*.b64 | base64 -d > "$RUNNER_TEMP/khabar-cafe-v043-overlay.tar.gz"
          echo '0cb745fd53f3fa30adef728f1d201430c02ec565b181abeae7e5d978f36a4c4f  '"$RUNNER_TEMP/khabar-cafe-v043-overlay.tar.gz" | sha256sum --check
          gzip -t "$RUNNER_TEMP/khabar-cafe-v043-overlay.tar.gz"
          tar -xzf "$RUNNER_TEMP/khabar-cafe-v043-overlay.tar.gz" -C kc/khabar_cafe
          sed -i "/^import 'dart:async';$/d" kc/khabar_cafe/lib/features/channels/application/channel_store.dart
          grep -q 'version: 0.4.3+7' kc/khabar_cafe/pubspec.yaml
          grep -q "channels.state.v1" kc/khabar_cafe/lib/features/channels/application/channel_store.dart

      - name: Apply v0.4.4 TDLib login fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('kc/khabar_cafe')
          p = root / 'android/app/src/main/kotlin/ir/khabarcafe/app/TdlibTelegramNativeBridge.kt'
          s = p.read_text()

          if 'connectionStatus: String' not in s:
              marker = '    @Volatile private var parametersSent = false\n'
              if marker not in s:
                  raise SystemExit('parameters marker missing')
              s = s.replace(marker, marker + '    @Volatile private var connectionStatus: String = "unknown"\n', 1)

          start = s.find('    private fun performAuthRequest(')
          end = s.find('    private fun withRequiredString(', start)
          if start < 0 or end < 0:
              raise SystemExit('performAuthRequest bounds missing')
          s = s[:start] + '''    private fun performAuthRequest(result: MethodChannel.Result, request: JSONObject) {
              worker.execute {
                  runTdlibCall(result) {
                      requestAuthorizationTransition(request, timeoutMs = 75_000)
                      null
                  }
              }
          }

          ''' + s[end:]

          if '"updateConnectionState" ->' not in s:
              marker = '        when (val type = update.optString("@type")) {\n'
              if marker not in s:
                  raise SystemExit('processUpdate marker missing')
              case = '''            "updateConnectionState" -> {
                  connectionStatus = update.optJSONObject("state")?.optString("@type")
                      ?.takeIf { it.isNotBlank() }
                      ?: "unknown"
              }
          '''
              s = s.replace(marker, marker + case, 1)

          if 'private fun requestAuthorizationTransition(' not in s:
              marker = '    private fun request(payload: JSONObject, timeoutSeconds: Long = 20): JSONObject {\n'
              if marker not in s:
                  raise SystemExit('request marker missing')
              helper = '''    private fun requestAuthorizationTransition(payload: JSONObject, timeoutMs: Long) {
              val previous = authorizationStatus
              val extra = "kc-auth-${sequence.getAndIncrement()}"
              payload.put("@extra", extra)
              val future = CompletableFuture<JSONObject>()
              pending[extra] = future
              if (!send(payload)) {
                  pending.remove(extra)
                  throw TdlibBridgeException("TDLIB_SEND_FAILED", "ارسال درخواست ورود به TDLib انجام نشد.")
              }

              val deadline = System.currentTimeMillis() + timeoutMs
              var directResponse: JSONObject? = null
              while (System.currentTimeMillis() < deadline) {
                  if (authorizationStatus != previous && authorizationStatus != "checking") {
                      pending.remove(extra)
                      return
                  }
                  if (future.isDone) {
                      directResponse = runCatching { future.get() }.getOrNull()
                      break
                  }
                  Thread.sleep(100)
              }
              pending.remove(extra)

              directResponse?.let { response ->
                  if (response.optString("@type") == "error") {
                      throw TdlibBridgeException(
                          code = "TDLIB_${response.optInt("code", 0)}",
                          message = response.optString("message", "خطای تلگرام"),
                      )
                  }
                  waitForAuthorizationChange(previous, 15_000)
                  return
              }

              if (authorizationStatus != previous) return
              throw TdlibBridgeException("TDLIB_NETWORK_TIMEOUT", networkTimeoutMessage())
          }

          private fun networkTimeoutMessage(): String = when (connectionStatus) {
              "connectionStateReady" -> "پاسخ ورود از تلگرام دیر دریافت شد. دوباره تلاش کنید."
              "connectionStateConnectingToProxy" -> "اتصال به پراکسی تلگرام برقرار نشد. پراکسی یا VPN را بررسی کنید."
              "connectionStateConnecting", "connectionStateUpdating" -> "ارتباط با سرورهای تلگرام کامل نشد. VPN یا اینترنت را بررسی کنید و دوباره تلاش کنید."
              else -> "TDLib نتوانست به سرورهای تلگرام وصل شود. VPN یا پراکسی سیستم را فعال یا بررسی کنید و دوباره تلاش کنید."
          }

          '''
              s = s.replace(marker, helper + marker, 1)

          p.write_text(s)

          p = root / 'lib/features/auth/presentation/auth_gate.dart'
          s = p.read_text()
          if "import 'package:flutter/services.dart';" not in s:
              marker = "import 'package:flutter/material.dart';\n"
              if marker not in s:
                  raise SystemExit('Flutter material import missing')
              s = s.replace(marker, marker + "import 'package:flutter/services.dart';\n", 1)

          submit = s.find('  Future<void> _submit() async {', s.find('final class _LoginPageState'))
          catch = s.find('    } on Object catch (error) {', submit)
          if submit < 0 or catch < 0:
              raise SystemExit('Flutter login catch missing')
          replacement = '''    } on PlatformException catch (error) {
              if (mounted) {
                  setState(() => _error = error.message ?? 'ورود به تلگرام انجام نشد.');
              }
          '''
          s = s[:catch] + replacement + s[catch:]
          p.write_text(s)
          PY
          sed -i 's/version: 0.4.3+7/version: 0.4.4+8/' kc/khabar_cafe/pubspec.yaml
          sed -i 's/نسخه آزمایشی ۰.۴.۳/نسخه آزمایشی ۰.۴.۴/' kc/khabar_cafe/lib/core/config/app_config.dart
          grep -q 'version: 0.4.4+8' kc/khabar_cafe/pubspec.yaml
          grep -q 'requestAuthorizationTransition' kc/khabar_cafe/android/app/src/main/kotlin/ir/khabarcafe/app/TdlibTelegramNativeBridge.kt
          grep -q 'TDLIB_NETWORK_TIMEOUT' kc/khabar_cafe/android/app/src/main/kotlin/ir/khabarcafe/app/TdlibTelegramNativeBridge.kt
          grep -q 'PlatformException catch' kc/khabar_cafe/lib/features/auth/presentation/auth_gate.dart

      - name: Restore Vazirmatn font assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kc/khabar_cafe/assets/fonts
          base='https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf'
          for weight in Regular Medium SemiBold Bold; do
            curl --fail --location --retry 4 "$base/Vazirmatn-${weight}.ttf" -o "kc/khabar_cafe/assets/fonts/Vazirmatn-${weight}.ttf"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Restore Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_BIN_DIR="$(dirname "$(command -v flutter)")"
          FLUTTER_SDK="$(cd "$FLUTTER_BIN_DIR/.." && pwd)"
          printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > kc/khabar_cafe/android/local.properties
          mkdir -p "$RUNNER_TEMP/wrapper-project"
          cd "$RUNNER_TEMP/wrapper-project"
          printf '' > build.gradle
          gradle wrapper --gradle-version 9.1.0
          cp gradlew gradlew.bat "$GITHUB_WORKSPACE/kc/khabar_cafe/android/"
          cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/kc/khabar_cafe/android/gradle/wrapper/"
          chmod +x "$GITHUB_WORKSPACE/kc/khabar_cafe/android/gradlew"

      - name: Reuse verified official TDLib ARM64 binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9167725364/zip" \
            -o "$RUNNER_TEMP/tdlib-artifact.zip"
          mkdir -p "$RUNNER_TEMP/tdlib-artifact"
          unzip -q "$RUNNER_TEMP/tdlib-artifact.zip" -d "$RUNNER_TEMP/tdlib-artifact"
          OLD_APK="$(find "$RUNNER_TEMP/tdlib-artifact" -type f -name '*.apk' | head -n 1)"
          test -n "$OLD_APK"
          mkdir -p kc/khabar_cafe/android/app/src/main/jniLibs/arm64-v8a
          unzip -p "$OLD_APK" lib/arm64-v8a/libtdjson.so > kc/khabar_cafe/android/app/src/main/jniLibs/arm64-v8a/libtdjson.so
          echo 'f4ab4e72f681a94cfcc580aa07b9dcb5b51bc91cbfee6630cde0f601f1f6144f  kc/khabar_cafe/android/app/src/main/jniLibs/arm64-v8a/libtdjson.so' | sha256sum --check

      - name: Flutter pub get
        working-directory: kc/khabar_cafe
        run: flutter pub get

      - name: Flutter analyze
        working-directory: kc/khabar_cafe
        run: flutter analyze

      - name: Flutter logic tests
        working-directory: kc/khabar_cafe
        run: flutter test test/channel_address_test.dart test/post_collection_test.dart

      - name: Build connected ARM64 release APK
        working-directory: kc/khabar_cafe
        run: |
          flutter build apk --release --target-platform android-arm64 --dart-define=TDLIB_ENABLED=true
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/khabar-cafe-v0.4.4-connected-arm64.apk
          sha256sum build/app/outputs/flutter-apk/khabar-cafe-v0.4.4-connected-arm64.apk

      - name: Upload connected APK
        uses: actions/upload-artifact@v4
        with:
          name: khabar-cafe-v0.4.4-connected-arm64-apk
          path: kc/khabar_cafe/build/app/outputs/flutter-apk/khabar-cafe-v0.4.4-connected-arm64.apk
          if-no-files-found: error
          retention-days: 14
