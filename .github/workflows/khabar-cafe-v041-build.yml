name: Khabar Cafe v0.4.1 connected APK

on:
  push:
    branches:
      - khabar-cafe-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reassemble Khabar Cafe source
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/source.sha256" <<'EOF'
          40e1c42c364d889d615aeb221b47b1daa5afff6f428682b629c34146dfe76a30  khabar-cafe-v041/p00.b64
          434e973a327010a63e1ceada12af18594d7051990c45f4dc3438672a4175b7ea  khabar-cafe-v041-repair/p01-0.b64
          c46ef6cdb9d5187eaf8a576e1815db948261444ff8aeac99c41ca396e04a5165  khabar-cafe-v041-repair/p01-1.b64
          cdedda0858397235dce6f3e4e7e9a4e68a7d808258f5a9183ff28e0a09ee3bbb  khabar-cafe-v041-repair/p01-2.b64
          8aa57023b4ec0fbb7712ae813c21520a7f37c4b30546f9b09ed57e2e007ee4e5  khabar-cafe-v041-repair2/p01-3-0.b64
          bbc02d6ee81fd03e4a91d113ae339c74c84d907f8bdb55f49fe04413e1664748  khabar-cafe-v041-repair3/p01-3-1-0.b64
          d185b487af5f5e70b902cf652e158b7fac89b58f0ffaaccbda3735ef8e4310f7  khabar-cafe-v041-repair3/p01-3-1-1.b64
          15f80b324fb7ba3d620a6ec7083866e4b5b2a8c9a87e362dc2a82ec81e9eaebf  khabar-cafe-v041-repair3/p01-3-1-2.b64
          91c07da2ea38e318539ab489c7275383d51397c48c4aaf0dd45dceb580417c0f  khabar-cafe-v041-repair3/p01-3-1-3.b64
          1297ffb6023b3664eb81aa023445207130225a4064c5dc87b569535daac1dff9  khabar-cafe-v041-repair3/p01-3-1-4.b64
          deb2bfaaaa5815ec2968892e2cf25c7cc0e489afba2e8bbb124a9364b967cb63  khabar-cafe-v041-repair2/p01-3-2.b64
          6cf66ae0a23971a37fbc1cf42eeeb856ed506cd39d1f29c69385ebd31ec492bc  khabar-cafe-v041-repair2/p01-3-3.b64
          14cfb1696b5731269ef8916920ca3fbf20eaaad2481805a14f2f5edc7996042a  khabar-cafe-v041/p02.b64
          b461529ad303a67d83f446d891d3d8e3fdc497bf8bd5e604176d5d6ca6227e82  khabar-cafe-v041/p03.b64
          7bc5f941f9a3be46a888e229fd136e7fc035006f2b26ce7e555f4d4766ec3e17  khabar-cafe-v041-repair/p04-0.b64
          904cc992dc88faa7dba195ec8f3f363cf54394af14d01c1a897bc054c658160a  khabar-cafe-v041-repair/p04-1.b64
          5096e4478c9cd3af7721c155de01fe29d9479f0cd9815b2dc1a362b090d68acd  khabar-cafe-v041-repair/p04-2.b64
          145916dccd4175c018b89cb9cb7b270f28e9c0ab2679e4b0588b8b942c1171be  khabar-cafe-v041-repair2/p04-3-0.b64
          1a1781a982af71842a0c2d85319720e023e82305532820ec89bad15e2b4893c3  khabar-cafe-v041-repair2/p04-3-1.b64
          914f4c5e06cc39d7ce96d938f3b26465b02af36de96cf514528d90cf7a45614a  khabar-cafe-v041-repair3/p04-3-2-0.b64
          d2f0fc5e6eea716d487500f04fe784df8e1c2559b908586e341fda819d7811d6  khabar-cafe-v041-repair3/p04-3-2-1.b64
          65c4b84f2493104f7dc4c1191f3d71c05535c882e3467458103ee0801c9f3759  khabar-cafe-v041-repair3/p04-3-2-2.b64
          1c4370059291388cd0efed4477c760df8dda5d8c0d39cd3206db6bc81271f0bc  khabar-cafe-v041-repair3/p04-3-2-3.b64
          5a037668f9a5006e3c6f5c2fd13d6899ad9aa5d30569cc21b3b82e4fe72b5093  khabar-cafe-v041-repair3/p04-3-2-4.b64
          950e344a906c1542263aefd7f749d8e8d41122aef34b76fd2893f901f16dff98  khabar-cafe-v041-repair2/p04-3-3.b64
          adbd8bbd5c0baca358c405d1d50a95c958bb3e5090f86941ca114048ee4edeca  khabar-cafe-v041/p05.b64
          1fb4a9ddc430dafb71a922fb68caeda47f125de19409f74cd66f84933095709d  khabar-cafe-v041/p06.b64
          91944112d4177f64db65e3a0951bcd0c6e20ca8fe151659c70550b097c7f361a  khabar-cafe-v041/p07.b64
          EOF
          sha256sum --check "$RUNNER_TEMP/source.sha256"

          : > "$RUNNER_TEMP/khabar-cafe-v041.tar.xz"
          decode() { base64 -d "$1" >> "$RUNNER_TEMP/khabar-cafe-v041.tar.xz"; }
          decode khabar-cafe-v041/p00.b64
          decode khabar-cafe-v041-repair/p01-0.b64
          decode khabar-cafe-v041-repair/p01-1.b64
          decode khabar-cafe-v041-repair/p01-2.b64
          decode khabar-cafe-v041-repair2/p01-3-0.b64
          for part in khabar-cafe-v041-repair3/p01-3-1-*.b64; do decode "$part"; done
          decode khabar-cafe-v041-repair2/p01-3-2.b64
          decode khabar-cafe-v041-repair2/p01-3-3.b64
          decode khabar-cafe-v041/p02.b64
          decode khabar-cafe-v041/p03.b64
          decode khabar-cafe-v041-repair/p04-0.b64
          decode khabar-cafe-v041-repair/p04-1.b64
          decode khabar-cafe-v041-repair/p04-2.b64
          decode khabar-cafe-v041-repair2/p04-3-0.b64
          decode khabar-cafe-v041-repair2/p04-3-1.b64
          for part in khabar-cafe-v041-repair3/p04-3-2-*.b64; do decode "$part"; done
          decode khabar-cafe-v041-repair2/p04-3-3.b64
          decode khabar-cafe-v041/p05.b64
          decode khabar-cafe-v041/p06.b64
          decode khabar-cafe-v041/p07.b64

          xz -t "$RUNNER_TEMP/khabar-cafe-v041.tar.xz"
          mkdir -p kc
          tar -xJf "$RUNNER_TEMP/khabar-cafe-v041.tar.xz" -C kc
          test -f kc/khabar_cafe/pubspec.yaml
          echo "Source restored successfully"

      - name: Restore Vazirmatn font assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kc/khabar_cafe/assets/fonts
          base='https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf'
          for weight in Regular Medium SemiBold Bold; do
            curl --fail --location --retry 4 "$base/Vazirmatn-${weight}.ttf" -o "kc/khabar_cafe/assets/fonts/Vazirmatn-${weight}.ttf"
          done
          test -s kc/khabar_cafe/assets/fonts/Vazirmatn-Regular.ttf

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Generate Gradle wrapper JAR
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_BIN_DIR="$(dirname "$(command -v flutter)")"
          FLUTTER_SDK="$(cd "$FLUTTER_BIN_DIR/.." && pwd)"
          printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > kc/khabar_cafe/android/local.properties
          cd kc/khabar_cafe/android
          gradle wrapper --gradle-version 9.1.0
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Checkout official TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          path: tdlib-src
          fetch-depth: 1

      - name: Patch official TDLib Android build to ARM64 only
        shell: bash
        run: |
          set -euo pipefail
          cd tdlib-src/example/android
          sed -i 's/for ABI in arm64-v8a armeabi-v7a x86_64 x86 ; do/for ABI in arm64-v8a ; do/' build-openssl.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Dockerfile')
          s=p.read_text()
          needle='RUN cd td && git merge-base --is-ancestor 872d8ebd3ba9d922169839e6a24cee08b02b328a "$COMMIT_HASH"\n'
          insert=needle+"RUN sed -i 's/for ABI in arm64-v8a armeabi-v7a x86_64 x86 ; do/for ABI in arm64-v8a ; do/' td/example/android/build-tdlib.sh\n"
          if needle not in s:
              raise SystemExit('TDLib Dockerfile anchor not found')
          p.write_text(s.replace(needle, insert))
          PY

      - name: Build official TDLib JSON ARM64
        shell: bash
        run: |
          set -euo pipefail
          cd tdlib-src/example/android
          docker build --build-arg TDLIB_INTERFACE=JSON --output "$RUNNER_TEMP/tdlib-output" .

      - name: Expand TDLib output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tdlib-expanded"
          while IFS= read -r -d '' archive; do unzip -o "$archive" -d "$RUNNER_TEMP/tdlib-expanded"; done < <(find "$RUNNER_TEMP/tdlib-output" -type f -name '*.zip' -print0)
          cp -a "$RUNNER_TEMP/tdlib-output/." "$RUNNER_TEMP/tdlib-expanded/"

      - name: Install libtdjson into app
        shell: bash
        working-directory: kc/khabar_cafe
        run: |
          set -euo pipefail
          chmod +x scripts/install_tdlib_json.sh
          scripts/install_tdlib_json.sh "$RUNNER_TEMP/tdlib-expanded"
          test -f android/app/src/main/jniLibs/arm64-v8a/libtdjson.so

      - name: Flutter pub get
        working-directory: kc/khabar_cafe
        run: flutter pub get

      - name: Flutter analyze
        working-directory: kc/khabar_cafe
        run: flutter analyze

      - name: Flutter tests
        working-directory: kc/khabar_cafe
        run: flutter test

      - name: Build connected ARM64 release APK
        working-directory: kc/khabar_cafe
        run: |
          flutter build apk --release --target-platform android-arm64 --dart-define=TDLIB_ENABLED=true
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/khabar-cafe-v0.4.1-connected-arm64.apk

      - name: Upload connected APK
        uses: actions/upload-artifact@v4
        with:
          name: khabar-cafe-v0.4.1-connected-arm64-apk
          path: kc/khabar_cafe/build/app/outputs/flutter-apk/khabar-cafe-v0.4.1-connected-arm64.apk
          if-no-files-found: error
          retention-days: 14
