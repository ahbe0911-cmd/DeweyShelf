name: Build LAN File Transfer V2

on:
  push:
    branches:
      - build/lan-file-transfer-v1
    paths:
      - 'lan-build/v2-overlay/**'
      - '.github/workflows/build-lan-file-transfer-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows V2 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct V1 base and apply V2 overlay
        shell: pwsh
        run: |
          $parts = @(
            'lan-build/minsrc_v4/part00.b64',
            'lan-build/minsrc_v4/part01.b64',
            'lan-build/minsrc_v4/part02.b64',
            'lan-build/minsrc_v4/part03.b64'
          )
          $b64 = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ''
          [IO.File]::WriteAllBytes('lan-min.tar.gz', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'lan-min.tar.gz' -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '377f0c46f6c1ba7a18fbf41ac0b08d565f3b84d337e3fdea31b33fba0a1c17af') { throw "Source SHA256 mismatch: $hash" }
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null
          tar -xzf lan-min.tar.gz -C buildsrc
          Copy-Item -Path 'lan-build\v2-overlay\*' -Destination 'buildsrc\lan_file_transfer_v1' -Recurse -Force
          if (!(Test-Path 'buildsrc\lan_file_transfer_v1\pc\lantransfer\discovery.py')) { throw 'V2 overlay failed' }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r dev-requirements.txt pyinstaller

      - name: Run PC tests
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m pytest -q

      - name: Add PyInstaller windowed stdio runtime hook
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          @'
          import os
          import sys
          if sys.stdout is None:
              sys.stdout = open(os.devnull, "w", encoding="utf-8")
          if sys.stderr is None:
              sys.stderr = open(os.devnull, "w", encoding="utf-8")
          '@ | Set-Content -Encoding UTF8 pyi_rth_windowed_stdio.py

      - name: Build standalone Windows EXE
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --runtime-hook pyi_rth_windowed_stdio.py --name LANFileTransferV2 app.py --collect-all uvicorn --collect-all fastapi --collect-all starlette --collect-all websockets
          if (!(Test-Path 'dist\LANFileTransferV2.exe')) { throw 'PyInstaller output missing' }

      - name: Real LAN service smoke test
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\LANFileTransferV2.exe' -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) { throw "App exited with code $($p.ExitCode)" }
              try {
                $r = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/ping' -TimeoutSec 1
                if ($r.service -eq 'LAN File Transfer' -and $r.version -eq '2.0.0') { $ok = $true; break }
              } catch {}
            }
            if (!$ok) { throw 'HTTP /api/ping did not become available' }

            $udp = New-Object System.Net.Sockets.UdpClient
            $udp.Client.ReceiveTimeout = 2500
            $msg = [Text.Encoding]::UTF8.GetBytes('LANFT_DISCOVER_V2')
            [void]$udp.Send($msg, $msg.Length, '127.0.0.1', 8766)
            $remote = New-Object System.Net.IPEndPoint([Net.IPAddress]::Any, 0)
            $bytes = $udp.Receive([ref]$remote)
            $text = [Text.Encoding]::UTF8.GetString($bytes)
            $obj = $text | ConvertFrom-Json
            $udp.Close()
            if ($obj.service -ne 'LAN File Transfer' -or $obj.port -ne 8765) { throw 'UDP radar response invalid' }
            Write-Host 'HTTP + UDP Radar smoke test passed.'
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Build Windows Setup with LAN firewall rules
        working-directory: buildsrc/lan_file_transfer_v1/pc
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          @'
          [Setup]
          AppId={{A783A5C0-2B74-4B25-98A8-8A25512E91F5}
          AppName=LAN File Transfer
          AppVersion=2.0.0
          AppPublisher=LAN File Transfer
          DefaultDirName={autopf}\LAN File Transfer
          DefaultGroupName=LAN File Transfer
          DisableProgramGroupPage=yes
          OutputDir=installer-output
          OutputBaseFilename=LANFileTransfer-Windows-V2-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\LANFileTransferV2.exe

          [Files]
          Source: "dist\LANFileTransferV2.exe"; DestDir: "{app}"; Flags: ignoreversion

          [InstallDelete]
          Type: files; Name: "{app}\LANFileTransfer.exe"

          [Icons]
          Name: "{autoprograms}\LAN File Transfer"; Filename: "{app}\LANFileTransferV2.exe"
          Name: "{autodesktop}\LAN File Transfer"; Filename: "{app}\LANFileTransferV2.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"

          [Run]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LAN File Transfer V2 TCP"""; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LAN File Transfer V2 TCP"" dir=in action=allow program=""{app}\LANFileTransferV2.exe"" enable=yes profile=private,public protocol=TCP localport=8765 remoteip=localsubnet"; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LAN File Transfer V2 UDP Radar"""; Flags: runhidden
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall add rule name=""LAN File Transfer V2 UDP Radar"" dir=in action=allow program=""{app}\LANFileTransferV2.exe"" enable=yes profile=private,public protocol=UDP localport=8766 remoteip=localsubnet"; Flags: runhidden
          Filename: "{app}\LANFileTransferV2.exe"; Description: "Launch LAN File Transfer"; Flags: nowait postinstall skipifsilent

          [UninstallRun]
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LAN File Transfer V2 TCP"""; Flags: runhidden; RunOnceId: "FirewallTcp"
          Filename: "{sys}\netsh.exe"; Parameters: "advfirewall firewall delete rule name=""LAN File Transfer V2 UDP Radar"""; Flags: runhidden; RunOnceId: "FirewallUdp"
          '@ | Set-Content -Encoding UTF8 installer.iss
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc installer.iss
          if (!(Test-Path 'installer-output\LANFileTransfer-Windows-V2-Setup.exe')) { throw 'Installer output missing' }

      - name: Upload Windows V2 installer
        uses: actions/upload-artifact@v4
        with:
          name: LANFileTransfer-Windows-V2
          path: buildsrc/lan_file_transfer_v1/pc/installer-output/LANFileTransfer-Windows-V2-Setup.exe
          if-no-files-found: error

  android:
    name: Android V2 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct V1 base and apply V2 overlay
        shell: bash
        run: |
          cat lan-build/minsrc_v4/part00.b64 lan-build/minsrc_v4/part01.b64 lan-build/minsrc_v4/part02.b64 lan-build/minsrc_v4/part03.b64 | base64 -d > lan-min.tar.gz
          echo '377f0c46f6c1ba7a18fbf41ac0b08d565f3b84d337e3fdea31b33fba0a1c17af  lan-min.tar.gz' | sha256sum -c -
          mkdir -p buildsrc
          tar -xzf lan-min.tar.gz -C buildsrc
          cp -a lan-build/v2-overlay/. buildsrc/lan_file_transfer_v1/
          test -f buildsrc/lan_file_transfer_v1/android/app/src/main/java/ir/local/lantransfer/LanNetwork.java
          sed -i 's/compileSdk = 37/compileSdk = 36/' buildsrc/lan_file_transfer_v1/android/app/build.gradle.kts

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Compile Android V2 APK
        working-directory: buildsrc/lan_file_transfer_v1/android
        run: |
          gradle --no-daemon :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p "$GITHUB_WORKSPACE/androidout"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/androidout/LANFileTransfer-Android-V2.apk"

      - name: Upload Android V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: LANFileTransfer-Android-V2
          path: androidout/LANFileTransfer-Android-V2.apk
          if-no-files-found: error

  publish:
    name: Publish V2 installers
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/lan-file-transfer-v1

      - uses: actions/download-artifact@v4
        with:
          name: LANFileTransfer-Windows-V2
          path: release-v2

      - uses: actions/download-artifact@v4
        with:
          name: LANFileTransfer-Android-V2
          path: release-v2

      - name: Publish V2 files and checksums
        shell: bash
        run: |
          cd release-v2
          sha256sum LANFileTransfer-Windows-V2-Setup.exe LANFileTransfer-Android-V2.apk > SHA256SUMS.txt
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-v2/LANFileTransfer-Windows-V2-Setup.exe release-v2/LANFileTransfer-Android-V2.apk release-v2/SHA256SUMS.txt
          git commit -m 'build: publish LAN File Transfer V2 installers [skip build]'
          git push origin HEAD:build/lan-file-transfer-v1
