plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.deweyshelf.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.deweyshelf.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildFeatures {
        buildConfig false
    }

    lint {
        abortOnError false
    }
}
